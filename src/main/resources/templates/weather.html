<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>関東の天気ダッシュボード</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, "Helvetica Neue", Arial; margin: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    table { border-collapse: collapse; width: 100%; max-width: 900px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f6f6f6; }
    .muted { color: #666; font-size: 0.9rem; }
    .small { font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>関東主要地点の天気</h1>
  <p class="muted">データ取得元: wttr.in — 最終更新は自動で1分ごとに更新します。</p>

  <div id="status" class="muted small">読み込み中…</div>

  <table id="weather-table" aria-live="polite">
    <thead>
      <tr>
        <th>地点</th>
        <th>時刻</th>
        <th>天気</th>
        <th>気温 (°C)</th>
        <th>生データ</th>
      </tr>
    </thead>
    <tbody id="weather-body">
      <tr><td colspan="5" class="muted">データがありません。しばらくお待ちください。</td></tr>
    </tbody>
  </table>

  <script>
    async function loadWeather() {
      const status = document.getElementById('status');
      try {
        status.textContent = '最新データを取得中...';
        const resp = await fetch('/api/weather', { cache: 'no-store' });
        if (!resp.ok) {
          status.textContent = '取得に失敗しました: ' + resp.status;
          return;
        }
        const list = await resp.json();
        render(list);
        status.textContent = '最終取得: ' + new Date().toLocaleString();
      } catch (err) {
        status.textContent = '取得エラー: ' + err;
      }
    }

    function render(list) {
      const tbody = document.getElementById('weather-body');
      tbody.innerHTML = '';
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="muted">データがありません。</td></tr>';
        return;
      }
      // list may be an object map depending on serialization; normalize to array
      const arr = Array.isArray(list) ? list : Object.values(list);
      arr.forEach(item => {
        const tr = document.createElement('tr');

        const tdLoc = document.createElement('td');
        tdLoc.textContent = item.location || '';
        tr.appendChild(tdLoc);

        const tdTime = document.createElement('td');
        const t = item.fetchedAt ? new Date(item.fetchedAt).toLocaleString() : '';
        tdTime.textContent = t;
        tr.appendChild(tdTime);

        const tdSummary = document.createElement('td');
        tdSummary.textContent = item.summary || '';
        tr.appendChild(tdSummary);

        const tdTemp = document.createElement('td');
        tdTemp.textContent = item.temperatureC || '';
        tr.appendChild(tdTemp);

        const tdRaw = document.createElement('td');
        if (item.rawJson) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = '表示';
          btn.onclick = () => {
            const w = window.open('', '_blank');
            w.document.write('<pre>' + escapeHtml(item.rawJson) + '</pre>');
            w.document.title = (item.location || 'raw') + ' - raw';
          };
          tdRaw.appendChild(btn);
        } else {
          tdRaw.textContent = '';
        }
        tr.appendChild(tdRaw);

        tbody.appendChild(tr);
      });
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"')
        .replace(/'/g, '&#039;');
    }

    // 初回ロードと定周期更新（既定：60秒）
    loadWeather();
    setInterval(loadWeather, 60 * 1000);
  </script>
</body>
</html>
