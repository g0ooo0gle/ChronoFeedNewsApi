spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# 収集対象のデータソースリスト
data.sources=news-api, weather-api, rss-feed

# NewsAPI
data.sources.news-api.url=https://newsapi.org/v2/top-headlines?country=jp
data.sources.news-api.api.key=YOUR_NEWS_API_KEY
data.sources.news-api.update.interval.ms=3600000
data.sources.news-api.type=NEWS

# OpenWeatherMap API
data.sources.weather-api.url=https://api.openweathermap.org/data/2.5/weather?q=Tokyo&units=metric
data.sources.weather-api.api.key=YOUR_WEATHER_API_KEY
data.sources.weather-api.update.interval.ms=1800000
data.sources.weather-api.type=WEATHER

# RSS Feed
data.sources.rss-feed.url=https://www.publickey1.jp/atom.xml
data.sources.rss-feed.update.interval.ms=1800000
data.sources.rss-feed.type=RSS

# 配信RSSフィードのメタデータ
rss.delivery.title=統合フィード by ChronoFeed
rss.delivery.description=複数の情報源をまとめたフィード
rss.delivery.link=http://localhost:8080/feed.rss